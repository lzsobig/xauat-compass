name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/ios-build-*'
    paths:
      - 'ios/ClassroomApp/**'
      - 'ios/Vendor/**'
      - 'tools/package-ios-app.py'
      - 'tools/*vad*'
      - 'tools/run-ios-simulator-smoke.py'
      - 'tests/test_swift_logic.swift'
      - 'tests/classroom_*'
      - 'tests/verify_classroom_exports.py'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Logic Unit Tests
        run: swift tests/test_swift_logic.swift
      - name: Test production classroom models and transcript boundaries
        run: |
          swiftc ios/ClassroomApp/Models.swift ios/ClassroomApp/ClassroomASRRequest.swift ios/ClassroomApp/TranscriptStitching.swift ios/ClassroomApp/ClassroomTextBatches.swift ios/ClassroomApp/ClassroomSliceBuffer.swift ios/ClassroomApp/ClassroomQuestionContext.swift tests/classroom_content_tests.swift -o /tmp/classroom-content-tests
          /tmp/classroom-content-tests
      - name: Test production timetable state and persisted undo
        run: |
          swiftc ios/ClassroomApp/Models.swift ios/ClassroomApp/CourseTimetableState.swift tests/classroom_timetable_state_tests.swift -o /tmp/classroom-timetable-tests
          /tmp/classroom-timetable-tests
      - name: Test actual multipage PDF timetable parsing
        run: |
          swiftc -D CLASSROOM_PDF_DIAGNOSTICS ios/ClassroomApp/Models.swift ios/ClassroomApp/TimetableEngine.swift tests/classroom_pdf_tests.swift -o /tmp/classroom-pdf-tests
          /tmp/classroom-pdf-tests
      - name: Test real bundled Silero model
        run: python3 tools/run-vad-tests.py
      - name: Compile and package for iPhone
        run: python3 tools/package-ios-app.py output/ClassroomApp.ipa
      - name: Generate and verify real classroom exports
        run: |
          swiftc ios/ClassroomApp/Models.swift ios/ClassroomApp/ClassroomExport.swift ios/Vendor/ZIPFoundation/*.swift tests/classroom_export_tests.swift -o /tmp/classroom-export-tests
          /tmp/classroom-export-tests output/export-fixtures
          python3 tests/verify_classroom_exports.py output/export-fixtures
      - name: Launch native app on an iPhone simulator
        run: python3 tools/run-ios-simulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: classroom-native-simulator
          path: |
            output/simulator-smoke/native-home.png
            output/simulator-smoke/result.json
            output/simulator-smoke/launch-diagnostics.txt
            output/simulator-smoke/ClassroomApp*.ips
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-export-fixtures
          path: output/export-fixtures
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomApp-ipa
          path: |
            output/ClassroomApp.ipa
            output/ClassroomApp.json
          if-no-files-found: error
