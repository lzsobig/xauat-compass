name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/ios-build-*'
    paths:
      - 'ios/ClassroomApp/**'
      - 'tools/package-ios-app.py'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and package for iPhone
        run: |
          python3 tools/package-ios-app.py output/ClassroomApp.ipa || {
            echo "::error::Build failed, running verbose swiftc to report error annotations:"
            xcrun --sdk iphoneos swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios15.0 -O -parse-as-library -module-name ClassroomApp ios/ClassroomApp/*.swift -o /tmp/test_build
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClassroomApp-ipa
          path: output/ClassroomApp.ipa
          if-no-files-found: error
